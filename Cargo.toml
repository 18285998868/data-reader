[workspace]
resolver = "3"
members = ["crates/binance-core", "crates/dukascopy-core"]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["NautilusTrader Developer"]
license = "MIT"
repository = "https://github.com/18285998868/data-reader"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
lzma-rust2 = "0.25"
numpy = "0.30"
pyo3 = { version = "0.30", features = ["abi3-py39"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = false
strip = "symbols"
